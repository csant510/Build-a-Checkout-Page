<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Checkout Page</title>
</head>
<body>
    <!--heading-->
    <h1>Checkout</h1>
    <!-- main-->
        <section>
            <h2>Your Cart</h2>
            <img alt="rubic cubs" src="https://cdn.freecodecamp.org/curriculum/labs/cube.jpg">
        </section>
         <section>
            <h2>Payment Information</h2>
            <form>
                <label for="card-name">CardHolder Name:
                    <span aria-hidden="true">*</span>
                </label>
                <input type="text" id="card-name" name="card-name" required>
                 <label for="card-number">Card Number:
                    <span aria-hidden="true">*</span>
                 </label>
                <input type="text" id="card-number" name="card-number" required aria-describedby="card-number-help">
                <p id="card-number-help">Please enter a valid card number.</p>
            </form>
         </section>
</body>
</html>
